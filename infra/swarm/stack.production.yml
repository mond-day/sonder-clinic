version: "3.9"

# Imagens são obrigatórias (sem fallback 1.0.0).
# Deploy oficial: infra/swarm/scripts/deploy.sh
# WEB_URL = URL pública HTTPS do frontend (também usada em e-mails).
# API_URL = URL pública da API consumida pelo browser (inclua /api/v1 se o cliente exigir).

services:
  migrate:
    image: ${API_IMAGE:?Defina API_IMAGE}
    command: ["node", "packages/database/dist/bootstrap-cli.js"]
    environment:
      NODE_ENV: production
      TZ: ${TZ:-America/Cuiaba}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-}
      BOOTSTRAP_KEEP_ALIVE: "true"
    networks: [digital_network]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 10 }
      resources:
        limits: { cpus: "0.50", memory: "512M" }
        reservations: { cpus: "0.05", memory: "128M" }

  web:
    image: ${WEB_IMAGE:?Defina WEB_IMAGE}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${WEB_URL:?Defina WEB_URL}
      NEXT_PUBLIC_API_URL: ${API_URL:?Defina API_URL}
      INTERNAL_API_URL: http://api:4000/api/v1
      BRAND_NAME: ${BRAND_NAME:-Sonder Clinic}
      BRAND_PRIMARY_COLOR: ${BRAND_PRIMARY_COLOR:-#176B5B}
    networks: [digital_network, traefik_public]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      restart_policy: { condition: on-failure, delay: 5s, max_attempts: 5 }
      resources:
        limits: { cpus: "${WEB_CPU_LIMIT:-0.75}", memory: "${WEB_MEMORY_LIMIT:-768M}" }
        reservations: { cpus: "${WEB_CPU_RESERVATION:-0.10}", memory: "${WEB_MEMORY_RESERVATION:-192M}" }
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_public
        - traefik.http.routers.sonder-web.rule=Host(`${APP_HOST:-app.sonder.clinic}`)
        - traefik.http.routers.sonder-web.entrypoints=websecure
        - traefik.http.routers.sonder-web.tls=true
        - traefik.http.routers.sonder-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
        - traefik.http.services.sonder-web.loadbalancer.server.port=3000

  api:
    image: ${API_IMAGE:?Defina API_IMAGE}
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      TZ: ${TZ:-America/Cuiaba}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Defina REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:?Defina S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:?Defina S3_BUCKET}
      QUEUE_DRIVER: redis
      STORAGE_DRIVER: s3
      AV_DRIVER: ${AV_DRIVER:-disabled}
      COOKIE_SECURE: "true"
      WEB_URL: ${WEB_URL:?Defina WEB_URL}
      CORS_ORIGIN: ${WEB_URL:?Defina WEB_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      INTEGRATION_SCOPE_DEFAULT: ${INTEGRATION_SCOPE_DEFAULT:-CLINIC}
      AI_PROVIDER: ${AI_PROVIDER:-OPENAI}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      INITIAL_SETUP_TOKEN: ${INITIAL_SETUP_TOKEN:-}
    secrets:
      - jwt_access_secret
      - jwt_refresh_secret
      - encryption_master_key
      - s3_access_key
      - s3_secret_key
    networks: [digital_network, traefik_public]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: ${API_REPLICAS:-1}
      restart_policy: { condition: on-failure, delay: 5s, max_attempts: 5 }
      resources:
        limits: { cpus: "${API_CPU_LIMIT:-1.00}", memory: "${API_MEMORY_LIMIT:-1G}" }
        reservations: { cpus: "${API_CPU_RESERVATION:-0.20}", memory: "${API_MEMORY_RESERVATION:-256M}" }
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_public
        - traefik.http.routers.sonder-api.rule=Host(`${API_HOST:-api.sonder.clinic}`)
        - traefik.http.routers.sonder-api.entrypoints=websecure
        - traefik.http.routers.sonder-api.tls=true
        - traefik.http.routers.sonder-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
        - traefik.http.services.sonder-api.loadbalancer.server.port=4000
        - traefik.http.services.sonder-api.loadbalancer.healthcheck.path=/api/v1/health/ready
        - traefik.http.services.sonder-api.loadbalancer.healthcheck.port=4000
        - traefik.http.services.sonder-api.loadbalancer.healthcheck.scheme=http
        - traefik.http.services.sonder-api.loadbalancer.healthcheck.interval=10s
        - traefik.http.services.sonder-api.loadbalancer.healthcheck.timeout=5s

  worker:
    image: ${WORKER_IMAGE:?Defina WORKER_IMAGE}
    environment:
      NODE_ENV: production
      TZ: ${TZ:-America/Cuiaba}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Defina REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:?Defina S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:?Defina S3_BUCKET}
      QUEUE_DRIVER: redis
      STORAGE_DRIVER: s3
      AV_DRIVER: ${AV_DRIVER:-disabled}
    secrets:
      - encryption_master_key
      - s3_access_key
      - s3_secret_key
    networks: [digital_network]
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      resources:
        limits: { cpus: "${WORKER_CPU_LIMIT:-1.00}", memory: "${WORKER_MEMORY_LIMIT:-1G}" }
        reservations: { cpus: "${WORKER_CPU_RESERVATION:-0.10}", memory: "${WORKER_MEMORY_RESERVATION:-256M}" }

networks:
  digital_network:
    external: true
  traefik_public:
    external: true

secrets:
  jwt_access_secret: { external: true }
  jwt_refresh_secret: { external: true }
  encryption_master_key: { external: true }
  s3_access_key: { external: true }
  s3_secret_key: { external: true }
