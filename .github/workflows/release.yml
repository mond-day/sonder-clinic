name: Release

# Tag canônica: v1.2.3 (não v.1.2.3).
# Ordem: testes essenciais → imagens GHCR → deploy Swarm (migrate incluso).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

env:
  REGISTRY: ghcr.io
  OWNER: mond-day

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
            image: sonder-clinic-api
          - name: web
            context: .
            file: apps/web/Dockerfile
            image: sonder-clinic-web
          - name: worker
            context: .
            file: apps/worker/Dockerfile
            image: sonder-clinic-worker
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_SHORT="${GITHUB_SHA::12}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag inválida: use v1.2.3 (sem ponto extra após o v)." >&2
            exit 1
          fi
          echo "semver=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.semver }}
            type=raw,value=${{ steps.meta.outputs.major_minor }}
            type=raw,value=latest
            type=raw,value=sha-${{ steps.meta.outputs.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.sonder.clinic/api/v1' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://app.sonder.clinic' }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Swarm
        env:
          VERSION: ${{ github.ref_name }}
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
          SWARM_SSH_KEY: ${{ secrets.SWARM_SSH_KEY }}
          SWARM_DEPLOY_DIR: ${{ vars.SWARM_DEPLOY_DIR }}
        run: |
          export VERSION="${VERSION#v}"
          chmod +x infra/swarm/scripts/ci-deploy.sh
          bash infra/swarm/scripts/ci-deploy.sh
