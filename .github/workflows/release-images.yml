name: Release images

on:
  push:
    branches: [main, master]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: mond-day

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
            image: sonder-clinic-api
          - name: web
            context: .
            file: apps/web/Dockerfile
            image: sonder-clinic-web
          - name: worker
            context: .
            file: apps/worker/Dockerfile
            image: sonder-clinic-worker
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          REF="${GITHUB_REF}"
          SHA_SHORT="${GITHUB_SHA::12}"
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
          elif [[ "$REF" == refs/tags/* ]]; then
            VERSION="${REF#refs/tags/}"
          else
            VERSION="0.0.0-sha.${SHA_SHORT}"
          fi
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            echo "semver=${MAJOR}.${MINOR}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
            echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "semver=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "major_minor=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.semver }}
            type=raw,value=${{ steps.meta.outputs.major_minor }},enable=${{ steps.meta.outputs.is_release }}
            type=raw,value=latest,enable=${{ steps.meta.outputs.is_release }}
            type=sha,prefix=,format=short
            type=raw,value=sha-${{ steps.meta.outputs.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.sonder.clinic
            NEXT_PUBLIC_APP_URL=https://app.sonder.clinic
