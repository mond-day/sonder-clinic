# Dependabot — atualizações de segurança e Actions
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Pacotes 0.x do OTel (sdk-node 0.57 → 0.221) entram como "minor" no
      # grupo production-deps e quebram se resources/sdk-trace ficarem em 1.x.
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
        update-types:
          - patch
          - minor
          - major
      production-deps:
        dependency-type: production
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
